---
name: Release
'on':
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Publish to Galaxy
        uses: robertdebock/galaxy-action@2da9916b23b62d328af9c8814ad5973d68817a7e # 1.2.0
        with:
          galaxy_api_key: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
          git_branch: main
