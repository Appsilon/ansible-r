---
name: TODO to GitHub Issue
'on':
  push:
    branches:
      - main

jobs:

  todo:
    name: TODO to GitHub Issue
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # v3

      - name: Raise GitHub issues for TODOs found
        uses: alstr/todo-to-issue-action@a7d3343580cc27e3ec9bb4afd776b75abf04925d  # v4.6.9
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_ASSIGN: true
